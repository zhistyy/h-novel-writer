<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>林晓写作</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="林晓写作">
<link rel="apple-touch-icon" href="icon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", sans-serif;
  background: #fff;
  color: #1a1a1a;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== Top Bar ===== */
.top-bar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 16px;
  height: 52px;
  background: #fff;
  border-bottom: 1px solid #eee;
  flex-shrink: 0;
}
.top-bar .back-area {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}
.menu-btn {
  width: 36px;
  height: 36px;
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: 8px;
  transition: background .15s;
}
.menu-btn:hover { background: #f0f0f0; }
.menu-btn:active { background: #e5e5e5; }
.menu-btn svg { width: 20px; height: 20px; stroke: #333; stroke-width: 2; fill: none; stroke-linecap: round; }

.project-title-area {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.project-title-area .title-text {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  line-height: 1.4;
}
.project-title-area .title-text:hover { background: #f0f0f0; }
.project-title-area .title-text input {
  font: inherit;
  font-weight: 600;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 2px 6px;
  width: 180px;
  outline: none;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ===== Buttons ===== */
.btn {
  height: 36px;
  padding: 0 16px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: #333;
  white-space: nowrap;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: #f5f5f5; border-color: #ccc; }
.btn:active { background: #ebebeb; transform: scale(.97); }
.btn-primary {
  background: #1a1a1a;
  color: #fff;
  border-color: #1a1a1a;
}
.btn-primary:hover { background: #333; border-color: #333; }
.btn-primary:active { background: #444; }
.btn-primary:disabled { background: #aaa; border-color: #aaa; cursor: not-allowed; transform: none; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn-icon-only {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 8px;
  border: 1px solid #eee;
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.btn-icon-only:hover { background: #f5f5f5; }
.btn-icon-only:active { background: #ebebeb; transform: scale(.95); }
.btn-icon-only:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.btn-icon-only svg { width: 18px; height: 18px; stroke: #555; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-icon-only.active { background: #f0f0f0; }
.btn-danger { color: #d32f2f; border-color: #ffcdd2; }
.btn-danger:hover { background: #ffebee; }

/* ===== Project Sidebar ===== */
.project-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.3);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.project-overlay.open { opacity: 1; pointer-events: auto; }
.project-panel {
  position: fixed;
  top: 0; left: -320px;
  width: 300px;
  max-width: 80vw;
  height: 100%;
  background: #fff;
  border-right: 1px solid #eee;
  box-shadow: 4px 0 24px rgba(0,0,0,.1);
  transition: left .25s cubic-bezier(.4,0,.2,1);
  z-index: 100;
  display: flex;
  flex-direction: column;
}
.project-panel.open { left: 0; }
.panel-header {
  padding: 16px;
  border-bottom: 1px solid #f0f0f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}
.panel-header h3 { font-size: 16px; font-weight: 600; color: #1a1a1a; }
.project-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.project-item {
  padding: 12px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .1s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.project-item:hover { background: #f7f7f7; }
.project-item.active { background: #f0f0f0; border-left-color: #1a1a1a; }
.project-item .p-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: #f0f0f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
  color: #555;
  flex-shrink: 0;
}
.project-item .p-body { flex: 1; min-width: 0; }
.project-item .p-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
.project-item .p-meta { font-size: 12px; color: #999; margin-top: 2px; }
.project-item .p-del {
  width: 28px; height: 28px;
  border: none; background: none;
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .15s;
  flex-shrink: 0;
}
.project-item:hover .p-del { opacity: 1; }
.project-item .p-del:hover { background: #fee; }

/* ===== Dialogs ===== */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.3);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.dialog {
  background: #fff;
  border-radius: 16px;
  width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,.15);
}
.dialog h3 { font-size: 17px; font-weight: 600; margin-bottom: 20px; color: #1a1a1a; }
.dialog .field { margin-bottom: 16px; }
.dialog label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #666;
  margin-bottom: 6px;
}
.dialog input, .dialog textarea, .dialog select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
  background: #fafafa;
}
.dialog input:focus, .dialog textarea:focus { border-color: #1a1a1a; background: #fff; }
.dialog textarea { resize: vertical; min-height: 64px; }
.dialog .btn-row {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}
.dialog .btn-row .btn { min-width: 80px; }

/* ===== Main Chat Area ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  -webkit-overflow-scrolling: touch;
}
.chat-area:empty::after {
  content: '创建项目后，输入剧情开始写作';
  display: block;
  text-align: center;
  color: #bbb;
  font-size: 15px;
  margin-top: 60px;
}

/* ===== Message Blocks ===== */
.msg-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg-plot {
  align-self: flex-end;
  max-width: 75%;
  background: #f0f0f0;
  padding: 12px 16px;
  border-radius: 16px 16px 4px 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #1a1a1a;
}
.msg-plot .label {
  font-size: 11px;
  color: #888;
  font-weight: 500;
  margin-bottom: 4px;
  letter-spacing: .5px;
}
.msg-novel {
  align-self: flex-start;
  max-width: 92%;
  width: 100%;
  background: #fafafa;
  padding: 16px 20px;
  border-radius: 16px 16px 16px 4px;
  font-size: 15px;
  line-height: 1.9;
  color: #1a1a1a;
  white-space: pre-wrap;
  word-wrap: break-word;
  border: 1px solid #f0f0f0;
}
.novel-content {
}
.novel-content p {
  text-indent: 2em;
  margin: 0 0 0.5em 0;
  min-height: 1em;
}
.msg-novel .label {
  font-size: 11px;
  color: #aaa;
  font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: .5px;
}
.msg-novel .locked-badge {
  display: inline-block;
  font-size: 11px;
  background: #f0f0f0;
  color: #888;
  padding: 2px 10px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 400;
}
.msg-actions {
  align-self: flex-start;
  display: flex;
  gap: 6px;
  margin-top: 4px;
  padding-left: 4px;
}
.msg-actions button {
  height: 28px;
  padding: 0 10px;
  font-size: 12px;
  color: #555;
  background: #f5f5f5;
  border: 1px solid #eee;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: inherit;
  transition: all .12s;
}
.msg-actions button:hover { background: #ebebeb; color: #333; }
.msg-actions button:active { transform: scale(.95); }
.msg-actions button.locked { color: #999; background: #f5f5f5; cursor: default; border-color: #f0f0f0; }

/* ===== Loading ===== */
.loading-msg {
  align-self: flex-start;
  padding: 16px 20px;
  font-size: 14px;
  color: #888;
}
.loading-msg .spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid #e0e0e0;
  border-top-color: #1a1a1a;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin-right: 10px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Bottom Input ===== */
.input-bar {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: #fff;
  border-top: 1px solid #eee;
  flex-shrink: 0;
}
.input-bar textarea {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.5;
  resize: none;
  outline: none;
  min-height: 48px;
  max-height: 150px;
  transition: border-color .15s;
  background: #fafafa;
}
.input-bar textarea:focus { border-color: #1a1a1a; background: #fff; }
.input-bar .input-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
.input-bar .input-actions .btn { height: 44px; padding: 0 24px; font-size: 15px; font-weight: 500; border-radius: 12px; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #ccc; }

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .chat-area { padding: 16px; gap: 20px; }
  .msg-novel { font-size: 15px; padding: 14px 16px; }
  .top-bar { padding: 0 12px; }
  .input-bar { padding: 10px 12px; }
  .input-bar .input-actions .btn { padding: 0 18px; }
  .project-panel { width: 280px; left: -300px; }
  .dialog { padding: 20px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="back-area">
    <button class="menu-btn" id="menuBtn" aria-label="项目列表">
      <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
    <div class="project-title-area">
      <span class="title-text" id="projectTitle">未选择项目</span>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn-icon-only" id="apiKeyBtn" title="API Key 设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
    </button>
    <button class="btn-icon-only" id="settingsBtn" title="女主设定">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button class="btn-icon-only" id="newProjectBtn" onclick="openNewProject()" title="新建项目">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
</div>

<!-- Main Chat Area -->
<div class="chat-area" id="chatArea"></div>

<!-- Input Bar -->
<div class="input-bar">
  <textarea id="inputText" rows="1" placeholder="输入剧情..." onkeydown="onInputKeydown(event)"></textarea>
  <div class="input-actions">
    <button class="btn-icon-only" id="undoBtn" onclick="undoLast()" disabled>
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
    </button>
    <button class="btn btn-primary" id="generateBtn" onclick="generate()">生成</button>
  </div>
</div>

<!-- Project Panel -->
<div class="project-overlay" id="projectOverlay" onclick="closeProjectPanel()"></div>
<div class="project-panel" id="projectPanel">
  <div class="panel-header">
    <h3>项目列表</h3>
    <button class="btn-icon-only" onclick="closeProjectPanel()" style="border:none;">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="project-list" id="projectList"></div>
</div>

<!-- Settings Dialog -->
<div class="overlay" id="settingsOverlay">
  <div class="dialog">
    <h3>女主设定</h3>
    <div class="field">
      <label>女主姓名</label>
      <input type="text" id="setHeroineName" placeholder="林晓">
    </div>
    <div class="field">
      <label>特殊体质 / 全书设定</label>
      <textarea id="setConstitution" rows="4" placeholder="如：天生媚骨、敏感体质、灵力炉鼎..."></textarea>
    </div>
    <div class="field">
      <label>记忆保留字数（用于段落衔接）</label>
      <input type="number" id="setRetentionChars" value="2000" min="200" max="5000">
    </div>
    <div class="btn-row">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- New Project Dialog -->
<div class="overlay" id="newProjectOverlay">
  <div class="dialog">
    <h3>新建项目</h3>
    <div class="field">
      <label>书名 / 项目名</label>
      <input type="text" id="newProjectName" placeholder="输入项目名称">
    </div>
    <div class="field">
      <label>女主姓名</label>
      <input type="text" id="newHeroineName" value="林晓">
    </div>
    <div class="field">
      <label>特殊体质 / 全书设定</label>
      <textarea id="newConstitution" rows="4" placeholder="如：天生媚骨、敏感体质、灵力炉鼎..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="closeNewProject()">取消</button>
      <button class="btn btn-primary" onclick="saveNewProject()">创建</button>
    </div>
  </div>
</div>

<!-- API Key Dialog -->
<div class="overlay" id="apiKeyOverlay">
  <div class="dialog">
    <h3>API Key 设置</h3>
    <p style="font-size:13px;color:#888;margin-bottom:16px;line-height:1.6;">输入你的 DeepSeek API Key，仅保存在本地浏览器中。</p>
    <div class="field">
      <label>DeepSeek API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-..." style="font-family:monospace;">
    </div>
    <div class="btn-row">
      <button class="btn" id="apiKeyCancelBtn" onclick="closeApiKeyDialog()">取消</button>
      <button class="btn btn-primary" onclick="saveApiKey()">保存</button>
    </div>
  </div>
</div>

<script>
// ========================================================
//  Configuration
// ========================================================
const CONFIG = {
  apiBase: 'https://api.deepseek.com',
  model: 'deepseek-v4-flash',
  maxTokens: 4096,
  temperature: 0.85,
  defaultRetentionChars: 2000
};

// ========================================================
//  System Prompt
// ========================================================
function buildSystemPrompt(project) {
  const heroineName = project.heroineName || '\u6797\u6653';
  const constitution = project.specialConstitution || '';
  const memory = project.memory || { compressedSummary: '', lastSegmentTail: '' };

  let prompt = `你是一个文本创作助手，以第一人称（"我"）视角创作女性向成人文本内容。

【核心设定】
- 视角：纯第一人称（"我"），女主视角
- 女主：${heroineName}
- 叙述方式：第一人称叙事，心理活动以默念/内心独白方式呈现
- 目标：创作真实、有沉浸感的女性视角成人叙事文本
`;

  if (constitution) {
    prompt += `\n【女主设定 / 特殊体质】\n${constitution}\n`;
  }

  prompt += `
【写作风格规范】
- 句子主谓宾齐全，结构简单，不省略主语
- 句子长短结合，长句铺画面，短句打节奏
- 连续短句后接长句缓气，连续长句后接短句收束
- 同一个意思、一口气能读完的信息不拆成多个短句
- 句子最短七个字（极少数打节奏的关键短句除外）
- 断句需降低理解成本，修饰语跟着被修饰的词走
- 逻辑完整，提示语灵活放置，可用自然动作做提示语
- 对话要有情感和人的味道，避免机器人式交流
- 心理活动以默念/内心独白方式呈现，避免密集怨怼，需穿插动作和反应
- 女主吐槽式心理描写增加代入感
- 比喻需简单直白：像/跟……一样/似的
- 描写需为情节服务，融入场景光影
【禁止使用】
- 禁"不是…而是…"结构
- 禁结尾收束总结（停在自然反应或语言上）
- 禁止大段描写（除非用于女主身材样貌刻画）
- 禁"心跳漏了一拍""心提到嗓子眼""血液凝固了""时间仿佛停止了""空气仿佛凝固了"等套话
- 禁带知识门槛或文艺腔的比喻
- 禁"讲述故事"式行文
- 避免高频重复的动作提示语（如"点点头""笑了笑""愣了一下"等）

【性行为描写规则】
- 必须使用直接生理词汇：阴茎、肉棒、龟头、囊袋、小穴、骚逼、阴唇、阴蒂、子宫口、蜜壶、精液、淫水、爱液
- 动作：插入、抽插、顶弄、舔舐、吸吮、啃咬、揉捏、掰开、贯穿
- 五感全覆盖：视觉（肉体交缠、体液拉丝）、听觉（喘息呻吟、肉体撞击声）、触觉（体温、湿润度、紧致度）、嗅觉（荷尔蒙气味）、味觉（唾液、汗水咸味）
- 从前戏到插入到高潮全过程详细描写
- 高潮后要有后戏氛围，不戛然而止
- 注意情绪基调：温柔缠绵/粗暴征服/偷情禁忌/诱惑勾引/屈辱沉沦

【创作原则】
- 角色行为由性格和世界观决定
- 正常描写即可，按叙事需要推进
- 不必刻意渲染黑暗或负面内容
`;

  if (memory.compressedSummary) {
    prompt += `\n【历史剧情概要】\n${memory.compressedSummary}\n`;
  }
  if (memory.lastSegmentTail) {
    prompt += `\n【上一段末尾（衔接用）】\n${memory.lastSegmentTail}\n`;
  }

  prompt += `\n请以${heroineName}的第一人称视角，根据用户输入的剧情输出一大段文本内容。尽可能多地输出文字，不要中途停止。须紧接上文内容，保持连贯。`;

  return prompt;
}

// ========================================================
//  IndexedDB
// ========================================================
const DB_NAME = 'linxiao_novel_tool';
const DB_VERSION = 2;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('projects')) {
        const store = db.createObjectStore('projects', { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt', { unique: false });
      }
      if (!db.objectStoreNames.contains('segments')) {
        const store = db.createObjectStore('segments', { keyPath: 'id' });
        store.createIndex('projectId', 'projectId', { unique: false });
        store.createIndex('order', 'order', { unique: false });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbGetSetting(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('settings', 'readonly');
    const store = tx.objectStore('settings');
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => reject(req.error);
  });
}

async function dbSetSetting(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('settings', 'readwrite');
    const store = tx.objectStore('settings');
    const req = store.put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGet(storeName, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(storeName, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(storeName, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function dbGetByIndex(storeName, indexName, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const index = store.index(indexName);
    const req = index.getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function editProjectName() {
  if (!state.currentProject) return;
  const el = $('projectTitle');
  const current = state.currentProject.name;
  el.innerHTML = `<input type="text" id="projectNameInput" value="${current.replace(/"/g, '&quot;')}" autofocus>`;

  input.focus();
  input.select();
  const onSave = async () => {
    const val = input.value.trim();
    if (val && state.currentProject) {
      state.currentProject.name = val;
      state.currentProject.updatedAt = Date.now();
      await dbPut('projects', state.currentProject);

      refreshProjectList();

function renderProjectTitle() {
  $('projectTitle').textContent = state.currentProject ? state.currentProject.name : '\u672A\u9009\u62E9\u9879\u76EE';
}

async function refreshProjectList() {
  state.projects = await dbGetAll('projects');
  state.projects.sort((a, b) => b.updatedAt - a.updatedAt);
  const list = $('projectList');
  list.innerHTML = '';
  for (const p of state.projects) {
    const segments = await dbGetByIndex('segments', 'projectId', p.id);
    const count = segments ? segments.filter(s => s.content).length : 0;
    const item = document.createElement('div');
    item.className = 'project-item' + (state.currentProject && state.currentProject.id === p.id ? ' active' : '');
    const initial = p.name.charAt(0);
    item.innerHTML = `
      <div class="p-icon">${initial}</div>
      <div class="p-body">
        <div class="p-name">${p.name}</div>
        <div class="p-meta">${count} 段</div>
      </div>
      <button class="p-del" onclick="event.stopPropagation();deleteProjectPrompt('${p.id}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
    `;

function deleteProjectPrompt(projectId) {
  const p = state.projects.find(x => x.id === projectId);
  if (p && confirm(`删除项目「${p.name}」？所有内容将被清除。`)) {
    deleteProject(projectId);
  }
}

async function deleteProject(projectId) {
  const segments = await dbGetByIndex('segments', 'projectId', projectId);
  for (const seg of segments) {
    await dbDelete('segments', seg.id);
  }
  await dbDelete('projects', projectId);
  if (state.currentProject && state.currentProject.id === projectId) {
    state.currentProject = null;
    state.segments = [];
    renderProjectTitle();
    renderChat();
    updateUndoBtn();
  }
  refreshProjectList();
}

async function switchProject(projectId) {
  const project = await dbGet('projects', projectId);
  if (!project) return;
  if (!project.memory) {
    project.memory = { compressedSummary: '', lastSegmentTail: '', retentionChars: CONFIG.defaultRetentionChars };
  }
  state.currentProject = project;
  const segments = await dbGetByIndex('segments', 'projectId', projectId);
  segments.sort((a, b) => a.order - b.order);
  state.segments = segments;
  renderProjectTitle();
  renderChat();
  updateUndoBtn();
  scrollToBottom();
}

// ========================================================
//  Chat Rendering
// ========================================================
function renderChat() {
  const area = $('chatArea');
  area.innerHTML = '';
  if (!state.currentProject) return;
  for (const seg of state.segments) {
    appendSegmentToDOM(seg, false);
  }
}

function appendSegmentToDOM(seg, scroll = true) {
  const area = $('chatArea');
  const group = document.createElement('div');
  group.className = 'msg-group';
  group.dataset.segId = seg.id;

  if (seg.plotInput) {
    const plotMsg = document.createElement('div');
    plotMsg.className = 'msg-plot';
    plotMsg.innerHTML = `<div class="label">剧情</div>${escapeHtml(seg.plotInput)}`;
    group.appendChild(plotMsg);
  }

  if (seg.content) {
    const novelMsg = document.createElement('div');
    novelMsg.className = 'msg-novel';
    const badge = seg.isLocked ? '<span class="locked-badge">已锁定</span>' : '';
    novelMsg.innerHTML = '<div class="label">文本 ' + badge + '</div><div class="novel-content">' + contentToParagraphs(seg.content) + '</div>';
    group.appendChild(novelMsg);

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    if (seg.isLocked) {
      actions.innerHTML = '<button class="locked">已锁定</button>';
    } else {
      actions.innerHTML = `
        <button onclick="regenerate('${seg.id}')">重新生成</button>
        <button onclick="toggleLock('${seg.id}')">锁定</button>
      `;
    }
    group.appendChild(actions);
  }

  area.appendChild(group);
  if (scroll) scrollToBottom();
}

function scrollToBottom() {
  const area = $('chatArea');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function contentToParagraphs(text) {
  if (!text) return '';
  const blocks = text.split(/\n{2,}/);
  return blocks.map(block => {
    if (!block.trim()) return '';
    const escaped = escapeHtml(block);
    return '<p>' + escaped.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

// ========================================================
//  Novel Generation
// ========================================================
function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    generate();
  }
  const el = e.target;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

async function generate() {
  const input = $('inputText');
  const plot = input.value.trim();
  if (!plot) { alert('\u8BF7\u8F93\u5165\u5267\u60C5'); return; }
  if (!state.currentProject) { alert('\u8BF7\u5148\u521B\u5EFA\u6216\u9009\u62E9\u4E00\u4E2A\u9879\u76EE'); return; }
  if (state.isGenerating) return;

  input.value = '';
  input.style.height = 'auto';

  const segId = 'seg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const seg = {
    id: segId,
    projectId: state.currentProject.id,
    order: state.segments.length,
    plotInput: plot,
    content: '',
    isLocked: false,
    createdAt: Date.now()
  };
  state.segments.push(seg);
  await dbPut('segments', seg);

  const area = $('chatArea');
  const group = document.createElement('div');
  group.className = 'msg-group';
  group.dataset.segId = segId;

  // Plot message
  const plotMsg = document.createElement('div');
  plotMsg.className = 'msg-plot';
  plotMsg.innerHTML = `<div class="label">剧情</div>${escapeHtml(plot)}`;
  group.appendChild(plotMsg);

  // Novel container - empty initially, filled by streaming
  const novelMsg = document.createElement('div');
  novelMsg.className = 'msg-novel';
  novelMsg.id = 'novel_' + segId;
  novelMsg.innerHTML = '<div class="label">文本</div><div class="novel-content" id="novelContent_' + segId + '"></div>';
  group.appendChild(novelMsg);

  area.appendChild(group);
  // Don't auto-scroll, keep scroll position fixed
  updateUndoBtn();

  state.isGenerating = true;
  $('generateBtn').textContent = '写作中';
  $('generateBtn').disabled = true;
  $('inputText').disabled = true;

  // Remember scroll position before generation
  // We don't auto-scroll during streaming, let user stay where they are

  try {
    const contentDiv = document.getElementById('novelContent_' + segId);

    await callDeepSeekStream(plot, (chunk) => {
      seg.content += chunk;
      contentDiv.innerHTML = contentToParagraphs(seg.content);
    });

    // Streaming done, save to DB
    await dbPut('segments', seg);

    // Add action buttons
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML = `
      <button onclick="regenerate('${segId}')">重新生成</button>
      <button onclick="toggleLock('${segId}')">锁定</button>
    `;
    group.appendChild(actions);

    await updateMemory(seg);

  } catch (err) {
    const contentDiv = document.getElementById('novelContent_' + segId);
    if (contentDiv) {
      contentDiv.insertAdjacentHTML('beforeend', `<span style="color:#d32f2f;font-size:13px;display:block;margin-top:8px;">生成中断：${err.message}</span>`);
    }
    seg.content += '\n\n[生成中断]';
    await dbPut('segments', seg);
  } finally {
    state.isGenerating = false;
    $('generateBtn').textContent = '生成';
    $('generateBtn').disabled = false;
    $('inputText').disabled = false;
    $('inputText').focus();
    updateUndoBtn();
  }
}

async function callDeepSeekStream(plot, onChunk) {
  const project = state.currentProject;
  const sysPrompt = buildSystemPrompt(project);

  let apiKey = await dbGetSetting('apiKey');
  if (!apiKey) {
    openApiKeyDialog();
    throw new Error('\u8BF7\u5148\u8F93\u5165 API Key');
  }

  const controller = new AbortController();
  state.generationAbortController = controller;

  const response = await fetch(CONFIG.apiBase + '/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model: CONFIG.model,
      messages: [
        { role: 'system', content: sysPrompt },
        { role: 'user', content: `【剧情】${plot}\n\n请以${project.heroineName || '林晓'}的第一人称视角输出下一大段文本内容，尽可能多写。` }
      ],
      max_tokens: CONFIG.maxTokens,
      temperature: CONFIG.temperature,
      stream: true
    }),
    signal: controller.signal
  });

  if (!response.ok) {
    let errMsg = `API 错误 ${response.status}`;
    try {
      const errData = await response.json();
      errMsg += ': ' + (errData.error?.message || JSON.stringify(errData));
    } catch (e) {}
    throw new Error(errMsg);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || ''; // keep incomplete line in buffer

    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || trimmed === 'data: [DONE]') continue;
      if (trimmed.startsWith('data: ')) {
        try {
          const json = JSON.parse(trimmed.slice(6));
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            onChunk(delta);
          }
        } catch (e) {
          // skip malformed JSON lines
        }
      }
    }
  }
}

// ========================================================
//  Memory Management
// ========================================================
async function updateMemory(seg) {
  if (!state.currentProject) return;
  const project = state.currentProject;
  const memory = project.memory;

  const allSegments = await dbGetByIndex('segments', 'projectId', project.id);
  allSegments.sort((a, b) => a.order - b.order);

  const recentPlots = allSegments
    .filter(s => s.plotInput)
    .slice(-5)
    .map(s => s.plotInput);
  memory.compressedSummary = '\u8FD1\u671F\u5267\u60C5\uFF1A' + recentPlots.join(' → ');

  const contentSegs = allSegments.filter(s => s.content && s.id !== seg.id);
  if (contentSegs.length > 0) {
    const last = contentSegs[contentSegs.length - 1];
    const N = memory.retentionChars || CONFIG.defaultRetentionChars;
    memory.lastSegmentTail = last.content.slice(-N);
  }

  project.updatedAt = Date.now();
  await dbPut('projects', project);
  state.currentProject = project;
}

// ========================================================
//  Actions: Undo, Regenerate, Lock
// ========================================================
function updateUndoBtn() {
  const btn = $('undoBtn');
  if (!state.currentProject || state.segments.length === 0) {
    btn.disabled = true;
    return;
  }
  const last = state.segments[state.segments.length - 1];
  btn.disabled = !last || last.isLocked || state.isGenerating;
}

async function undoLast() {
  if (state.isGenerating) return;
  if (!state.currentProject || state.segments.length === 0) return;

  const last = state.segments[state.segments.length - 1];
  if (last.isLocked) { alert('\u6700\u540E\u4E00\u6BB5\u5DF2\u9501\u5B9A\uFF0C\u65E0\u6CD5\u64A4\u56DE'); return; }

  await dbDelete('segments', last.id);
  state.segments.pop();

  const el = document.querySelector(`[data-seg-id="${last.id}"]`);
  if (el) el.remove();

  updateUndoBtn();
  scrollToBottom();
}

async function regenerate(segId) {
  if (state.isGenerating) { alert('\u6B63\u5728\u751F\u6210\u4E2D\uFF0C\u8BF7\u7B49\u5F85'); return; }
  const seg = state.segments.find(s => s.id === segId);
  if (!seg || seg.isLocked) return;
  if (!seg.plotInput) return;

  const oldEl = document.querySelector(`[data-seg-id="${segId}"]`);
  if (oldEl) oldEl.remove();

  const idx = state.segments.findIndex(s => s.id === segId);
  if (idx >= 0) state.segments.splice(idx, 1);
  await dbDelete('segments', segId);

  $('inputText').value = seg.plotInput;
  $('inputText').focus();

  await generate();
}

async function toggleLock(segId) {
  const seg = state.segments.find(s => s.id === segId);
  if (!seg) return;
  seg.isLocked = !seg.isLocked;
  await dbPut('segments', seg);

  const oldEl = document.querySelector(`[data-seg-id="${segId}"]`);
  if (oldEl) oldEl.remove();
  appendSegmentToDOM(seg, true);
  updateUndoBtn();
}

async function init() {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js');
    } catch (e) {
      console.log('SW registration failed:', e);
    }
  }

  $('menuBtn').onclick = toggleProjectPanel;

  $('apiKeyBtn').onclick = openApiKeyDialog;
  $('settingsBtn').onclick = openSettings;

  await refreshProjectList();
  if (state.projects.length > 0) {
    await switchProject(state.projects[0].id);
  }

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      if (!state.isGenerating) {
        e.preventDefault();
        undoLast();
      }
    }
  });
}

init();
</script>
</body>
</html>
